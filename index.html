<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add DotOne Chain</title>
<meta name="description" content="DotOne Smart Chain را با یک تأیید به ولت خود اضافه کنید.">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #151518;
    --surface-2: #1d1d21;
    --border: #2a2a30;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --gold-1: #f7d774;
    --gold-2: #e9b949;
    --gold-3: #c48f1f;
    --gold-grad: linear-gradient(135deg, var(--gold-1), var(--gold-2) 50%, var(--gold-3));
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(233,185,73,.18), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .topbar { display: flex; justify-content: flex-end; }
  .lang {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .hero { text-align: center; margin: 8px 0 26px; }
  .logo-ring {
    width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 50%;
    padding: 3px; background: var(--gold-grad);
    box-shadow: 0 10px 40px rgba(233,185,73,.25);
  }
  .logo-ring img { width: 100%; height: 100%; border-radius: 50%; display: block; background: #000; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 8px; line-height: 1.4; }
  h1 .brand {
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    unicode-bidi: isolate; direction: ltr; display: inline-block;
  }
  .sub { color: var(--muted); margin: 0; font-size: 15px; line-height: 1.8; }

  .section-title { font-size: 14px; color: var(--muted); font-weight: 500; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wallet {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 15px;
    position: relative; transition: border-color .15s, transform .1s, background .15s;
    -webkit-tap-highlight-color: transparent; min-height: 64px; cursor: pointer;
  }
  .wallet:hover { border-color: #3a3a42; background: var(--surface-2); }
  .wallet:active { transform: scale(.98); }
  .wallet .ico { width: 36px; height: 36px; border-radius: 10px; overflow: hidden; flex: none; display: grid; place-items: center; }
  .wallet .ico svg { width: 100%; height: 100%; display: block; }
  .wallet .name { direction: ltr; unicode-bidi: isolate; line-height: 1.25; }
  .wallet .badge {
    position: absolute; top: -7px; inset-inline-start: 10px;
    background: var(--ok); color: #052e12; font-size: 10px; font-weight: 800;
    border-radius: 999px; padding: 2px 8px;
  }
  .wallet.other { grid-column: 1 / -1; justify-content: center; color: var(--muted); font-weight: 500; }
  .wallet.other .ico { background: var(--surface-2); color: var(--gold-2); width: 28px; height: 28px; border-radius: 8px; }

  .note {
    margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.8;
    background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.25); color: #fde68a;
  }
  .note a { color: var(--gold-1); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    padding: 22px; text-align: center;
  }
  .detected { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .detected .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(74,222,128,.15); }
  .detected b { color: var(--text); direction: ltr; unicode-bidi: isolate; }
  .btn-primary {
    width: 100%; border: 0; border-radius: 16px; padding: 17px 18px;
    background: var(--gold-grad); color: #1a1205; font: inherit; font-weight: 800; font-size: 17px;
    cursor: pointer; box-shadow: 0 10px 30px rgba(233,185,73,.25); transition: transform .1s, opacity .15s;
  }
  .btn-primary:active { transform: scale(.985); }
  .btn-primary[disabled] { opacity: .6; cursor: default; }
  .btn-ghost {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px;
    margin-top: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px;
  }
  .status { margin-top: 16px; font-size: 14px; line-height: 1.8; min-height: 1px; }
  .status.pending { color: var(--warn); }
  .status.err { color: var(--err); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-inline-end: 6px;
    border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .success-ico {
    width: 72px; height: 72px; border-radius: 50%; margin: 4px auto 14px;
    background: rgba(74,222,128,.12); color: var(--ok); display: grid; place-items: center;
  }
  .success h2 { margin: 0 0 6px; font-size: 20px; }
  .success p { margin: 0 0 18px; color: var(--muted); line-height: 1.8; }
  .link-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 11px 18px; border-radius: 12px;
    border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 14px; background: var(--surface-2);
  }

  details.manual { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  details.manual summary {
    list-style: none; cursor: pointer; padding: 15px 16px; font-weight: 700; font-size: 15px;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.manual summary::-webkit-details-marker { display: none; }
  details.manual summary .chev { transition: transform .2s; color: var(--muted); }
  details.manual[open] summary .chev { transform: rotate(180deg); }
  .manual-body { padding: 0 16px 14px; }
  .manual-hint { color: var(--muted); font-size: 13px; line-height: 1.8; margin: 0 0 10px; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border);
  }
  .row .k { color: var(--muted); font-size: 13px; width: 92px; flex: none; }
  .row .v {
    flex: 1; min-width: 0; direction: ltr; text-align: left; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px; overflow-wrap: anywhere;
  }
  .copy {
    flex: none; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; min-width: 58px;
  }
  .copy.done { color: var(--ok); border-color: rgba(74,222,128,.4); }

  footer { text-align: center; color: #71717a; font-size: 12px; margin-top: 26px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }

  html[dir="ltr"] .row .k { width: 110px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="lang" id="langBtn" type="button">EN</button></div>

  <header class="hero">
    <div class="logo-ring"><img src="logo.png" alt="DotOne"></div>
    <h1><span data-i18n="h1a"></span> <span class="brand">DotOne Smart Chain</span></h1>
    <p class="sub" data-i18n="sub"></p>
  </header>

  <!-- A: wallet picker -->
  <section id="viewPick">
    <p class="section-title" data-i18n="pick"></p>
    <div class="grid" id="walletGrid"></div>
    <div class="note" id="pickNote" hidden></div>
  </section>

  <!-- B: inside a wallet -->
  <section id="viewAdd" hidden>
    <div class="card">
      <div class="detected"><span class="dot"></span><span data-i18n="detected"></span> <b id="detName"></b></div>
      <button class="btn-primary" id="addBtn" type="button" data-i18n="addBtn"></button>
      <div class="status" id="status" aria-live="polite"></div>
      <button class="btn-ghost" id="backBtn" type="button" data-i18n="otherWallet"></button>
    </div>
  </section>

  <!-- C: done -->
  <section id="viewDone" hidden>
    <div class="card success">
      <div class="success-ico">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h2 data-i18n="doneT"></h2>
      <p data-i18n="doneD"></p>
      <a class="link-btn" href="https://dotscan.one" target="_blank" rel="noopener"><span data-i18n="explorer"></span> ↗</a>
    </div>
  </section>

  <details class="manual" id="manual">
    <summary><span data-i18n="manualT"></span><span class="chev">▾</span></summary>
    <div class="manual-body">
      <p class="manual-hint" data-i18n="manualHint"></p>
      <div id="rows"></div>
    </div>
  </details>

  <footer>DotOne Smart Chain · Chain ID 505 · <a href="https://dotscan.one" target="_blank" rel="noopener">dotscan.one</a></footer>
</div>

      noProvider: 'ولتی در این مرورگر پیدا نشد. ولت خود را از لیست انتخاب کنید.',
      opening: 'در حال باز کردن {w}…',
      notOpened: '{w} باز نشد؟ ابتدا <a href="{i}" target="_blank" rel="noopener">اپ را نصب کنید</a> و دوباره QR را اسکن کنید.',
      desktopNo: 'افزونه {w} روی این مرورگر نصب نیست. QR را با گوشی اسکن کنید یا <a href="{i}" target="_blank" rel="noopener">افزونه را نصب کنید</a>.',
      doneT: 'شبکه اضافه شد',
      doneD: 'DotOne Smart Chain حالا در ولت شما فعال است.',
      explorer: 'مشاهده در DotScan',
      manualT: 'اطلاعات شبکه (افزودن دستی)',
      manualHint: 'در ولت به بخش «افزودن شبکه» یا Add Network بروید و این مقادیر را وارد کنید.',
      kName: 'نام شبکه', kRpc: 'آدرس RPC', kId: 'Chain ID', kSym: 'نماد ارز', kExp: 'اکسپلورر',
      copy: 'کپی', copied: 'کپی شد ✓',
      lang: 'EN',
    },
    en: {
      h1a: 'Add',
      sub: 'Pick your wallet and the network is added with a single confirmation.',
      pick: 'Which wallet do you use?',
      other: 'Other wallet / add manually',
      found: 'Installed',
      detected: 'Wallet detected:',
      yourWallet: 'Your wallet',
      addBtn: 'Add DotOne to wallet',
      otherWallet: 'Choose a different wallet',
      pending: 'Confirm the request in your wallet…',
      rejected: 'Request cancelled. Tap the button to try again.',
      error: "This wallet didn't accept the automatic request. Enter the details below manually.",
      noProvider: 'No wallet found in this browser. Pick your wallet from the list.',
      opening: 'Opening {w}…',
      notOpened: '{w} didn\'t open? <a href="{i}" target="_blank" rel="noopener">Install the app</a> first, then scan the QR again.',
      desktopNo: '{w} extension isn\'t installed in this browser. Scan the QR with your phone, or <a href="{i}" target="_blank" rel="noopener">install the extension</a>.',
      doneT: 'Network added',
      doneD: 'DotOne Smart Chain is now available in your wallet.',
      explorer: 'Open DotScan',
      manualT: 'Network details (manual setup)',
      manualHint: 'In your wallet, open "Add Network" and enter these values.',
      kName: 'Network name', kRpc: 'RPC URL', kId: 'Chain ID', kSym: 'Currency symbol', kExp: 'Block explorer',
      copy: 'Copy', copied: 'Copied ✓',
      lang: 'فا',
    },
  };

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const fromWallet = params.get('w');
  const ua = navigator.userAgent;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  let lang = 'fa';
  try { lang = localStorage.getItem('dotone-lang') || (params.get('lang') === 'en' ? 'en' : 'fa'); } catch (e) {}
  const t = (k, vars = {}) => T[lang][k].replace(/\{(\w)\}/g, (_, v) => vars[v] ?? '');

  // ---- Provider discovery (EIP-6963 + legacy window.ethereum) ----
  const announced = [];
  window.addEventListener('eip6963:announceProvider', e => {
    const d = e.detail;
    if (d && d.provider && !announced.some(a => a.info.uuid === d.info.uuid)) announced.push(d);
  });
  window.dispatchEvent(new Event('eip6963:requestProvider'));

  function legacyProviders() {
    const eth = window.ethereum;
    if (!eth) return [];
    return Array.isArray(eth.providers) && eth.providers.length ? eth.providers : [eth];
  }

  function findProvider(wallet) {
    const a = announced.find(x => wallet.rdns.includes(x.info.rdns));
    if (a) return { provider: a.provider, name: a.info.name || wallet.name };
    const p = legacyProviders().find(p => { try { return wallet.is(p); } catch (e) { return false; } });
    return p ? { provider: p, name: wallet.name } : null;
  }

  function anyProvider() {
    const pref = fromWallet && WALLETS.find(w => w.id === fromWallet);
    if (pref) { const m = findProvider(pref); if (m) return m; }
    for (const w of WALLETS) { const m = findProvider(w); if (m) return m; }
    if (announced.length) return { provider: announced[0].provider, name: announced[0].info.name };
    const eth = window.ethereum;
    return eth ? { provider: eth, name: null } : null;
  }

  function waitForProvider(ms) {
    return new Promise(resolve => {
      const start = Date.now();
      const done = () => { window.removeEventListener('ethereum#initialized', tick); resolve(); };
      const tick = () => {
        if (window.ethereum || announced.length) return done();
        if (Date.now() - start >= ms) return done();
        setTimeout(tick, 100);
      };
      window.addEventListener('ethereum#initialized', tick, { once: true });
      tick();
    });
  }

  // ---- Views ----
  let active = null; // { provider, name }
  let busy = false;

  function show(view) {
    $('viewPick').hidden = view !== 'pick';
    $('viewAdd').hidden = view !== 'add';
    $('viewDone').hidden = view !== 'done';
  }

  function setStatus(kind, msg) {
    const el = $('status');
    el.className = 'status ' + (kind || '');
    el.innerHTML = kind === 'pending' ? '<span class="spinner"></span>' + msg : (msg || '');
  }

  function pickNote(html) {
    const n = $('pickNote');
    n.innerHTML = html || '';
    n.hidden = !html;
  }

  function enterAdd(match, auto) {
    active = match;
    $('detName').textContent = match.name || t('yourWallet');
    setStatus('', '');
    show('add');
    if (auto) setTimeout(addNetwork, 500);
  }

  async function addNetwork(retried) {
    if (!active || busy) return;
    busy = true;
    $('addBtn').disabled = true;
    setStatus('pending', t('pending'));
    try {
      await active.provider.request({ method: 'wallet_addEthereumChain', params: [NETWORK] });
      show('done');
    } catch (e) {
      const code = e && (e.code ?? e.data?.originalError?.code);
      if (code === 4100 && !retried) {
        // Some wallets want a connection before accepting network requests.
        try {
          await active.provider.request({ method: 'eth_requestAccounts' });
          busy = false;
          await addNetwork(true);
          return;
        } catch (e2) { /* fall through */ }
      }
      if (code === 4001) setStatus('err', t('rejected'));
      else { setStatus('err', t('error')); $('manual').open = true; }
    } finally {
      busy = false;
      $('addBtn').disabled = false;
    }
  }

  function dappUrl(id) {
    const u = new URL(location.href);
    u.hash = '';
    u.search = '';
    u.searchParams.set('w', id);
    if (lang === 'en') u.searchParams.set('lang', 'en');
    return u.toString();
  }

  function renderWallets() {
    const grid = $('walletGrid');
    grid.innerHTML = '';
    for (const w of WALLETS) {
      const a = document.createElement('a');
      a.className = 'wallet';
      a.href = isMobile ? w.link(dappUrl(w.id)) : '#';
      a.innerHTML = `<span class="ico">${ICONS[w.id] || ''}</span><span class="name">${w.name}</span>`;
      if (!isMobile && findProvider(w)) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = t('found');
        a.appendChild(b);
      }
      a.addEventListener('click', ev => onWallet(ev, w));
      grid.appendChild(a);
    }
    const o = document.createElement('button');
    o.type = 'button';
    o.className = 'wallet other';
    o.innerHTML = `<span class="ico">＋</span><span>${t('other')}</span>`;
    o.addEventListener('click', () => {
      const m = $('manual');
      m.open = true;
      m.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    grid.appendChild(o);
  }

  function onWallet(ev, w) {
    const match = findProvider(w);
    if (match) { // the wallet is right here (extension, or we're inside its browser)
      ev.preventDefault();
      enterAdd(match, true);
      return;
    }
    if (!isMobile) {
      ev.preventDefault();
      pickNote(t('desktopNo', { w: w.name, i: w.install }));
      return;
    }
    // Mobile: let the anchor open the wallet's in-app browser. If we're still here, it likely isn't installed.
    pickNote(t('opening', { w: w.name }));
    let left = false;
    const onHide = () => { left = true; };
    document.addEventListener('visibilitychange', onHide, { once: true });
    window.addEventListener('pagehide', onHide, { once: true });
    setTimeout(() => {
      if (!left && document.visibilityState === 'visible') pickNote(t('notOpened', { w: w.name, i: w.install }));
    }, w.scheme ? 1800 : 3000);
  }

  function renderRows() {
    const rows = [
      ['kName', NETWORK.chainName],
      ['kRpc', NETWORK.rpcUrls[0]],
      ['kId', String(parseInt(NETWORK.chainId, 16))],
      ['kSym', NETWORK.nativeCurrency.symbol],
      ['kExp', NETWORK.blockExplorerUrls[0]],
    ];
    const box = $('rows');
    box.innerHTML = '';
    for (const [k, v] of rows) {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<span class="k">${t(k)}</span><span class="v"></span><button class="copy" type="button">${t('copy')}</button>`;
      r.querySelector('.v').textContent = v;
      const btn = r.querySelector('.copy');
      btn.addEventListener('click', () => copy(v, btn));
      box.appendChild(r);
    }
  }

  async function copy(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      ta.remove();
    }
    btn.textContent = t('copied');
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = t('copy'); btn.classList.remove('done'); }, 1600);
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    $('langBtn').textContent = t('lang');
    if (active) $('detName').textContent = active.name || t('yourWallet');
    renderWallets();
    renderRows();
    pickNote('');
    if (!$('viewAdd').hidden && $('status').textContent) setStatus('', '');
  }

  $('langBtn').addEventListener('click', () => {
    lang = lang === 'fa' ? 'en' : 'fa';
    try { localStorage.setItem('dotone-lang', lang); } catch (e) {}
    applyLang();
  });
  $('addBtn').addEventListener('click', () => addNetwork());
  $('backBtn').addEventListener('click', () => { active = null; show('pick'); });

  applyLang();
  show('pick');

  waitForProvider(fromWallet ? 2000 : 800).then(() => {
    renderWallets(); // refresh "installed" badges
    const match = anyProvider();
    if (match && (isMobile || fromWallet)) enterAdd(match, Boolean(fromWallet));
    else if (fromWallet) pickNote(t('noProvider'));
  });
})();
</script>
</body>
</html>
